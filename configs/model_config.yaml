# Model configuration — all hyperparameters for R1/R2/R3 tournament
# Modify experiment params here; training code reads from this file.

experiment:
  seeds: [42, 777, 1234]              # multi-seed suite; first seed is the canonical single-run seed
  n_cv_folds: 5
  cv_gap: 5          # windows to drop between folds (temporal CV)
  mlflow_experiment: "PV-FDD-PFE-2026"

# ============================================================================
# TASK A — Anomaly Detection
# ============================================================================
anomaly_detection:
  # ── Shared threshold calibration — applies to every anomaly detector ───────
  # All baselines (PC-AE, PC-DLSSM, MAAT, OC-SVM, IForest, BOCD) use this same
  # procedure on their normal-class scores so cross-model comparisons are
  # apples-to-apples. Per-model overrides are still possible via
  # `<model>.threshold_strategy` etc., but the default is what's set here.
  threshold:
    # "gpd"      — Peaks-Over-Threshold + Generalized Pareto fit (recommended).
    # "quantile" — q-th percentile of normal scores (simple fallback).
    strategy: gpd
    # GPD params:
    pot_quantile: 0.90          # quantile that starts the tail (typical 0.80–0.95)
    target_tail_prob: 0.05      # desired P(score > threshold) on normal data
    # Quantile-strategy fallback / param:
    percentile: 95.0

  # Runtime decomposition: ml + dl
  ml:
    active_model: one_class_svm
    hpo:
      direction: maximize
      validation_mode: holdout
      sampler: tpe
      pruner: none
      study_name_prefix: anomaly_ml
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_ml.db"
      n_trials_phase1: 35
      timeout_seconds: null
    models:
      isolation_forest:
        scaling: standard
        max_train_samples: null
        contamination: auto
        n_jobs: -1
        bootstrap: false
        warm_start: false
        search_space:
          n_estimators: {type: int, low: 200, high: 600, step: 100}
          max_samples: {type: categorical, choices: [512, 1024, 2048, auto]}
          max_features: {type: float, low: 0.5, high: 1.0, step: 0.1}
      one_class_svm:
        scaling: standard          # StandardScaler fitted on train only
        max_train_samples: 40000   
        cache_size_mb: 1000
        shrinking: true
        tol: 1.0e-3
        kernels:
          rbf:
            nu: {type: float, low: 0.03, high: 0.10, log: true}
            gamma: {type: float, low: 0.01, high: 0.08, log: true}
          poly:
            degree: 3              # cubic — fixed
            nu: {type: float, low: 0.01, high: 0.20, log: true}
            gamma: {type: categorical, choices: [scale, auto, 0.01, 0.1]}
            coef0: {type: float, low: 0.0, high: 1.0}
      xgboost:
        scaling: none
        max_train_samples: null
        objective: binary:logistic
        eval_metric: aucpr
        tree_method: hist
        n_jobs: -1
        early_stopping_rounds: 50
        auto_scale_pos_weight: true
        search_space:
          n_estimators: {type: int, low: 400, high: 2000, step: 100}
          learning_rate: {type: float, low: 0.02, high: 0.08, log: true}
          max_depth: {type: int, low: 3, high: 6}
          min_child_weight: {type: float, low: 1.0, high: 32.0, log: true}
          subsample: {type: float, low: 0.5, high: 0.9}
          colsample_bytree: {type: float, low: 0.4, high: 0.9}
          gamma: {type: categorical, choices: [0.0, 0.001, 0.01, 0.1, 0.3, 1.0, 3.0]}
          reg_alpha: {type: categorical, choices: [0.0, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0, 10.0]}
          reg_lambda: {type: float, low: 1.0e-6, high: 100.0, log: true}
          scale_pos_weight_multiplier: {type: categorical, choices: [0.25, 0.5, 1.0, 2.0]}
      bocd:
        scaling: standard
        max_run_length: 200
        kappa0: 1.0
        alpha0: 2.0
        search_space:
          hazard_lambda: {type: float, low: 50.0, high: 2000.0, log: true}

  dl:
    active_model: maat
    hpo:
      mode: conditional
      sampler: tpe
      pruner: hyperband
      early_stopping: true
      study_name_prefix: anomaly_dl_maat
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_dl.db"
      trial_budget:
        stage1_training: 35
        stage2_architecture: 25
      max_epochs_fraction: 0.45
      min_hpo_epochs: 15
      patience_fraction: 0.40
      min_hpo_patience: 8
      pruning_warmup_epochs: 7
    models:
      maat:
        win_size: 30
        block_size: 10
        d_model: 64
        n_heads: 2
        e_layers: 2
        d_ff: 256
        dropout: 0.1
        k: 3.0
        temperature: 50
        train_stride: 5
        eval_stride: 1
        score_reduction: max
        scaling: standard
        gate_mode: learned          # learned | attention_only | mamba_only
        hpo_stage1:
          learning_rate:     {type: float, low: 5.0e-5, high: 8.0e-4, log: true}
          weight_decay:      {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
          dropout:           {type: float, low: 0.0, high: 0.25}
          k:                 {type: float, low: 2.0, high: 6.0}
          temperature:       {type: categorical, choices: [10, 25, 50, 100]}
          batch_size:        {type: categorical, choices: [512, 1024, 2048]}
          gradient_clip_val: {type: categorical, choices: [0.5, 1.0, 2.0]}
        hpo_stage2:
          win_size:     {type: categorical, choices: [30, 60, 90, 120]}
          block_size:   {type: categorical, choices: [5, 10, 15, 30]}
          d_model:      {type: categorical, choices: [32, 64, 128]}
          n_heads:      {type: categorical, choices: [2, 4, 8]}
          e_layers:     {type: int, low: 1, high: 4}
          d_ff:         {type: categorical, choices: [128, 256, 512]}
        # Single conditional study — replaces greedy two-stage when hpo.mode=conditional
        # n_trials = stage1_training + stage2_architecture (back-compat sum)

      dlssm:
        win_size: 60
        train_stride: 5
        eval_stride: 1
        hidden_dim: 64
        latent_dim: 12
        encoder_dim: 96
        decoder_dim: 96
        n_gru_layers: 1
        dropout: 0.1
        se_reduction_ratio: 4

        beta_kl: 0.1
        kl_warmup_epochs: 5
        free_bits: 0.05

        # Physics-conditioned prior (PC-DLSSM)
        context_features: [irr, pvt]   # exogenous sensors used to condition p_c(z|c_t)
        gamma_pc: 1.0                  # weight of aux KL(stop_grad(q) || p_c) in training loss

        # Numerical stability guards for scoring
        # NB: all values must be valid YAML float literals — PyYAML safe_load
        # does NOT parse "1.0e5" or "1e5" as numbers (they become strings).
        stability:
          score_instability_p95: 1000000.0
          score_instability_max: 10000000.0
          non_finite_warn_limit_per_epoch: 5
          max_abs_base_score_term: 100000.0

        lambda_kl_score: 0.1
        score_reduction: mean

        batch_size: 1024
        learning_rate: 1.0e-3
        weight_decay: 1.0e-5
        gradient_clip_val: 1.0
        accelerator: auto
        precision: 32-true
        scaling: standard

        hpo:
          mode: single_stage
          sampler: tpe
          pruner: median
          n_trials: 80
          timeout_seconds: 18000
          max_epochs_fraction: 0.25
          min_hpo_epochs: 10
          patience_fraction: 0.33
          min_hpo_patience: 5
          pruning_warmup_epochs: 5
          search_space:
            learning_rate:        {type: float, low: 1.0e-4, high: 7.0e-4, log: true}
            weight_decay:         {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
            dropout:              {type: float, low: 0.0,    high: 0.3}
            free_bits:            {type: categorical, choices: [0.0, 0.05]}
            lambda_kl_score:      {type: float, low: 0.05, high: 0.3, log: true}
            score_reduction:      {type: categorical, choices: [center, mean, max]}
            gamma_pc:             {type: float, low: 0.1, high: 5.0, log: true}

      pc_ae:
        # Point-wise Physics-Conditioned Autoencoder
        # Stateless MLP encoder/decoder. window=1 (point-wise scoring).
        # c-invariance regularizer forces z to encode only the operating-point-invariant
        # part of the signal (the I-V manifold), which PV faults break.
        win_size: 1
        train_stride: 1
        eval_stride: 1
        hidden_dim: 64
        latent_dim: 16
        dropout: 0.1
        # Context features for the conditional decoder; also targeted by c-invariance regularizer.
        context_features: [irr, pvt]
        # Regularizer weight: forces encode(x) ≈ encode(shuffle_c_in_x(x))
        lambda_c_inv: 1.0
        # Threshold calibration strategy.
        # - "gpd": Peaks-Over-Threshold + Generalized Pareto fit on training tail.
        #          Extrapolates the tail rather than relying on a single empirical
        #          quantile — more rigorous when targeting a low FAR. (Default.)
        # - "quantile": Threshold = q-th percentile of training reconstruction errors.
        threshold_strategy: gpd
        # GPD parameters (only used when threshold_strategy = gpd):
        #   pot_quantile: quantile defining the start of the tail (typical 0.80–0.95).
        #   target_tail_prob: desired P(score > threshold) on normal data (FAR target).
        pot_quantile: 0.90
        target_tail_prob: 0.05
        # Fallback quantile if threshold_strategy = quantile or GPD has too few exceedances.
        threshold_percentile: 95.0
        batch_size: 4096
        learning_rate: 1.0e-3
        weight_decay: 1.0e-5
        gradient_clip_val: 1.0
        max_epochs: 50
        patience: 10
        accelerator: auto
        precision: 32-true
        scaling: standard
        hpo:
          mode: single_stage
          sampler: tpe
          pruner: median
          n_trials: 40
          timeout_seconds: 10800
          max_epochs_fraction: 0.30
          min_hpo_epochs: 10
          patience_fraction: 0.40
          min_hpo_patience: 5
          pruning_warmup_epochs: 3
          search_space:
            learning_rate: {type: float, low: 1.0e-4, high: 3.0e-3, log: true}
            weight_decay:  {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
            dropout:       {type: float, low: 0.0,    high: 0.3}
            lambda_c_inv:  {type: float, low: 0.1,    high: 10.0, log: true}

      pc_flow:
        # Physics-Conditioned Normalizing Flow (RealNVP-style)
        # Conditional affine-coupling blocks model p(x | irr, pvt).
        # Anomaly score = NLL = -log p(x | c). No MSE averaging → directly
        # sensitive to subtle multivariate imbalances (cls2 degradation).
        # ~12k params, stateless, ONNX-exportable, sub-ms CPU inference.
        win_size: 1
        train_stride: 1
        eval_stride: 1
        n_coupling_layers: 4
        hidden_dim: 32
        dropout: 0.0
        context_features: [irr, pvt]
        # Shared GPD threshold strategy (see anomaly_detection.threshold)
        batch_size: 4096
        learning_rate: 3.0e-4
        weight_decay: 1.0e-5
        gradient_clip_val: 1.0
        max_epochs: 50
        patience: 10
        accelerator: auto
        precision: 32-true
        hpo:
          mode: single_stage
          sampler: tpe
          pruner: median
          n_trials: 10
          timeout_seconds: 10800
          max_epochs_fraction: 0.30
          min_hpo_epochs: 5
          patience_fraction: 0.40
          min_hpo_patience: 3
          pruning_warmup_epochs: 3
          search_space:
            learning_rate:      {type: float, low: 1.0e-4, high: 1.0e-3, log: true}
            weight_decay:       {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
            n_coupling_layers:  {type: categorical, choices: [3, 4, 5]}
            hidden_dim:         {type: categorical, choices: [32, 64]}
            dropout:            {type: float, low: 0.0, high: 0.2}

      pv_gdn:
        win_size: 30
        train_stride: 5
        eval_stride: 1
        d_model: 64
        temporal_kernel_size: 3
        temporal_layers: 2
        graph_top_k: 4
        dropout: 0.1
        batch_size: 1024
        learning_rate: 1.0e-3
        weight_decay: 1.0e-5
        accelerator: auto
        precision: 32-true
        score_reduction: max_group

  primary_metric: f1
  threshold_calibration: validation_pr_curve_f1

# ============================================================================
# TASK B — Fault Classification
# ============================================================================
classification:
  calibration:
    enabled: true
    method: sigmoid        # sigmoid (safe default) or isotonic

  # Runtime decomposition: ml only
  ml:
    active_model: lightgbm
    models:
      lightgbm:
        n_estimators: [200, 500]
        learning_rate: [0.05, 0.1]
        num_leaves: [31, 63]
        subsample: [0.8, 1.0]
        colsample_bytree: [0.7, 1.0]
        reg_alpha: [1.0e-8, 10.0]
        reg_lambda: [1.0e-8, 10.0]
        min_child_samples: [10, 100]
      catboost:
        iterations: {type: int, low: 300, high: 1200, step: 100}
        depth: {type: int, low: 4, high: 8}
        learning_rate: {type: float, low: 0.02, high: 0.15, log: true}
        l2_leaf_reg: {type: float, low: 1.0e-2, high: 20.0, log: true}
        random_strength: {type: float, low: 1.0e-8, high: 5.0, log: true}
        bagging_temperature: {type: float, low: 0.0, high: 5.0}
        border_count: {type: categorical, choices: [64, 128, 254]}
      extra_trees:
        n_estimators: {type: int, low: 300, high: 1200, step: 100}
        criterion: {type: categorical, choices: [gini, entropy, log_loss]}
        max_depth: {type: categorical, choices: [null, 8, 12, 16, 24, 32]}
        min_samples_split: {type: int, low: 2, high: 20}
        min_samples_leaf: {type: int, low: 1, high: 10}
        max_features: {type: categorical, choices: [sqrt, log2, 0.5, 0.8, 1.0]}
        bootstrap: {type: categorical, choices: [false, true]}
    hpo:
      direction: maximize
      validation_mode: holdout      # holdout | segment_temporal_cv
      sampler: tpe                  # ML policy default
      pruner: none                  # ML policy: no pruner
      study_name_prefix: classification_ml_macro
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_ml.db"
      n_trials_phase1: 50
      timeout_seconds: null

  primary_metric: f1_macro

# ============================================================================
# TRAINING
# ============================================================================
training:
  hardware_profile: colab_high
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_annealing_warmup
  warmup_steps: 100
  min_lr_ratio: 0.01
  max_epochs: 100
  patience: 10             # early stopping
  batch_size: 1024
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  precision: bf16-mixed     # bf16 training (A100 tensor cores); val/test trainers force 32-true for scoring
  threading:
    prefer_physical_cores: true
    reserve_cores: 1
    max_threads: null
    optuna_parallel_trials: 1
    dl_num_workers: 0
    dl_pin_memory: auto
    dl_persistent_workers: false
    dl_prefetch_factor: 2
