# Model configuration — all hyperparameters for R1/R2/R3 tournament
# Modify experiment params here; training code reads from this file.

experiment:
  seeds: [42, 777, 1234]              # multi-seed suite; first seed is the canonical single-run seed
  n_cv_folds: 5
  cv_gap: 5          # windows to drop between folds (temporal CV)
  mlflow_experiment: "PV-FDD-PFE-2026"

# ============================================================================
# TASK A — Anomaly Detection
# ============================================================================
anomaly_detection:
  # Runtime decomposition: ml + dl
  ml:
    active_model: one_class_svm
    hpo:
      direction: maximize
      validation_mode: holdout
      sampler: tpe
      pruner: none
      study_name_prefix: anomaly_ml
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_ml.db"
      n_trials_phase1: 50
      timeout_seconds: null
    models:
      isolation_forest:
        scaling: standard
        max_train_samples: null
        contamination: auto
        n_jobs: -1
        bootstrap: false
        warm_start: false
        search_space:
          n_estimators: {type: int, low: 200, high: 600, step: 100}
          max_samples: {type: categorical, choices: [512, 1024, 2048, auto]}
          max_features: {type: float, low: 0.5, high: 1.0, step: 0.1}
      one_class_svm:
        scaling: standard          # StandardScaler fitted on train only
        max_train_samples: 20000   
        cache_size_mb: 1000
        shrinking: true
        tol: 1.0e-3
        kernels:
          rbf:
            nu: {type: float, low: 0.03, high: 0.10, log: true}
            gamma: {type: float, low: 0.01, high: 0.08, log: true}
          poly:
            degree: 3              # cubic — fixed
            nu: {type: float, low: 0.01, high: 0.20, log: true}
            gamma: {type: categorical, choices: [scale, auto, 0.01, 0.1]}
            coef0: {type: float, low: 0.0, high: 1.0}
      xgboost:
        scaling: none
        max_train_samples: null
        objective: binary:logistic
        eval_metric: aucpr
        tree_method: hist
        n_jobs: -1
        early_stopping_rounds: 50
        auto_scale_pos_weight: true
        search_space:
          n_estimators: {type: int, low: 400, high: 2000, step: 100}
          learning_rate: {type: float, low: 0.02, high: 0.08, log: true}
          max_depth: {type: int, low: 3, high: 6}
          min_child_weight: {type: float, low: 1.0, high: 32.0, log: true}
          subsample: {type: float, low: 0.5, high: 0.9}
          colsample_bytree: {type: float, low: 0.4, high: 0.9}
          gamma: {type: categorical, choices: [0.0, 0.001, 0.01, 0.1, 0.3, 1.0, 3.0]}
          reg_alpha: {type: categorical, choices: [0.0, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0, 10.0]}
          reg_lambda: {type: float, low: 1.0e-6, high: 100.0, log: true}
          scale_pos_weight_multiplier: {type: categorical, choices: [0.25, 0.5, 1.0, 2.0]}
      bocd:
        scaling: standard
        max_run_length: 200
        kappa0: 1.0
        alpha0: 2.0
        search_space:
          hazard_lambda: {type: float, low: 50.0, high: 2000.0, log: true}

  dl:
    active_model: maat
    hpo:
      mode: auto_two_stage
      sampler: tpe
      pruner: median
      validation_mode: temporal_cv        # group-aware CV (episode_id → segment_id → operating_day_id)
      cv_folds: 3
      cv_gap_groups: 1                    # groups skipped between train and val per fold
      early_stopping: true
      study_name_prefix: anomaly_dl_maat
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_dl.db"
      run_stage3: false
      trial_budget:
        stage1_training: 40
        stage2_architecture: 30
        stage3_joint: 12
      max_epochs_fraction: 0.30
      min_hpo_epochs: 15
      patience_fraction: 0.40
      min_hpo_patience: 6
      pruning_warmup_epochs: 5
    models:
      maat:
        win_size: 30
        block_size: 10
        d_model: 64
        n_heads: 2
        e_layers: 2
        d_ff: 256
        dropout: 0.1
        k: 3.0
        temperature: 50
        train_stride: 1
        eval_stride: 1
        score_reduction: max
        scaling: standard
        hpo_stage1:
          learning_rate:     {type: float, low: 5.0e-5, high: 1.0e-3, log: true}
          weight_decay:      {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
          dropout:           {type: float, low: 0.0, high: 0.30}
          k:                 {type: float, low: 2.0, high: 6.0}
          temperature:       {type: categorical, choices: [10, 25, 50]}
          batch_size:        {type: categorical, choices: [128, 256, 512]}
          gradient_clip_val: {type: categorical, choices: [0.5, 1.0, 2.0]}
        hpo_stage2:
          win_size:     {type: categorical, choices: [20, 30, 60, 90]}
          block_size:   {type: categorical, choices: [5, 10, 15, 30]}
          d_model:      {type: categorical, choices: [32, 64, 128]}
          n_heads:      {type: categorical, choices: [2, 4, 8]}
          e_layers:     {type: int, low: 1, high: 4}
          d_ff:         {type: categorical, choices: [128, 256, 512]}
          dropout:      {type: categorical, choices: [0.0, 0.1, 0.2]}
          train_stride: {type: categorical, choices: [1, 2, 3]}

      dlssm:
        win_size: 60
        train_stride: 1
        eval_stride: 1
        hidden_dim: 128
        latent_dim: 32
        encoder_dim: 256
        decoder_dim: 256
        n_gru_layers: 1
        dropout: 0.1

        beta_kl: 0.1
        kl_warmup_epochs: 5
        free_bits: 0.05

        lambda_phys: 0.1
        physics_components:
          string_power: true
          imbalance: true
          temperature_correction: false   # disabled until base is stable

        # Semi-supervised paradigms — override via --one-class / --consistency CLI flags
        one_class: false                  # Deep SVDD-style latent compactness
        lambda_oc: 0.1                    # training loss weight
        lambda_oc_score: 0.1              # scoring weight
        oc_warmup_epochs: 3               # train pure ELBO first; then init c

        consistency: false                # consistency regularization on q_mu
        lambda_cons: 0.1
        aug_noise_std: 0.05
        aug_feature_dropout: 0.1

        # Conditional VAE — overridden by --cvae CLI flag
        cvae: false
        conditioning:
          features: [irr, pvt]
          recon_skip_features: [irr, pvt, pdc_temp_corrected, pdc_temp_corrected_norm_irr]

        alpha_pred: 0.1            # prediction head loss weight; 0.0 disables prediction head in loss
        lambda_kl_score: 0.1
        lambda_phys_score: 0.05
        lambda_pred_score: 0.1
        score_reduction: max

        batch_size: 256
        learning_rate: 1.0e-3
        weight_decay: 1.0e-5
        gradient_clip_val: 1.0
        accelerator: auto
        scaling: standard

        hpo:
          mode: single_stage
          sampler: tpe
          pruner: median
          n_trials: 80
          timeout_seconds: 18000
          max_epochs_fraction: 0.25
          min_hpo_epochs: 10
          patience_fraction: 0.33
          min_hpo_patience: 5
          pruning_warmup_epochs: 3
          search_space:
            learning_rate:        {type: float, low: 1.0e-4, high: 3.0e-3, log: true}
            weight_decay:         {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
            dropout:              {type: float, low: 0.0,    high: 0.3}
            free_bits:            {type: categorical, choices: [0.0, 0.05, 0.1]}
            lambda_phys:          {type: float, low: 0.02, high: 0.3, log: true}
            lambda_oc:            {type: float, low: 0.02, high: 0.3, log: true}
            lambda_cons:          {type: float, low: 0.02, high: 0.3, log: true}
            lambda_kl_score:      {type: float, low: 0.05, high: 0.3, log: true}
            lambda_pred_score:    {type: float, low: 0.0,  high: 0.3}
            lambda_oc_score:      {type: float, low: 0.0,  high: 0.3}
            lambda_phys_score:    {type: float, low: 0.0,  high: 0.2}
            aug_noise_std:        {type: float, low: 0.02, high: 0.15}
            aug_feature_dropout:  {type: float, low: 0.0,  high: 0.2}
            score_reduction:      {type: categorical, choices: [center, mean, max]}

  primary_metric: pr_auc   # PR-AUC
  threshold_calibration: pr_curve  # use precision-recall to set alarm threshold

# ============================================================================
# TASK B — Fault Classification
# ============================================================================
classification:
  # Runtime decomposition: ml only
  ml:
    active_model: lightgbm
    models:
      lightgbm:
        n_estimators: [200, 500]
        learning_rate: [0.05, 0.1]
        num_leaves: [31, 63]
        subsample: [0.8, 1.0]
        colsample_bytree: [0.7, 1.0]
        reg_alpha: [1.0e-8, 10.0]
        reg_lambda: [1.0e-8, 10.0]
        min_child_samples: [10, 100]
      catboost:
        iterations: {type: int, low: 300, high: 1200, step: 100}
        depth: {type: int, low: 4, high: 8}
        learning_rate: {type: float, low: 0.02, high: 0.15, log: true}
        l2_leaf_reg: {type: float, low: 1.0e-2, high: 20.0, log: true}
        random_strength: {type: float, low: 1.0e-8, high: 5.0, log: true}
        bagging_temperature: {type: float, low: 0.0, high: 5.0}
        border_count: {type: categorical, choices: [64, 128, 254]}
      extra_trees:
        n_estimators: {type: int, low: 300, high: 1200, step: 100}
        criterion: {type: categorical, choices: [gini, entropy, log_loss]}
        max_depth: {type: categorical, choices: [null, 8, 12, 16, 24, 32]}
        min_samples_split: {type: int, low: 2, high: 20}
        min_samples_leaf: {type: int, low: 1, high: 10}
        max_features: {type: categorical, choices: [sqrt, log2, 0.5, 0.8, 1.0]}
        bootstrap: {type: categorical, choices: [false, true]}
    hpo:
      direction: maximize
      validation_mode: holdout      # holdout | segment_temporal_cv
      sampler: tpe                  # ML policy default
      pruner: none                  # ML policy: no pruner
      study_name_prefix: classification_ml
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_ml.db"
      n_trials_phase1: 50
      timeout_seconds: null

  primary_metric: f1_weighted

# ============================================================================
# TRAINING
# ============================================================================
training:
  hardware_profile: colab_high
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  scheduler: cosine_annealing_warmup
  warmup_steps: 100
  min_lr_ratio: 0.01
  max_epochs: 100
  patience: 15             # early stopping
  batch_size: 256
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  precision: 16-mixed       # mixed precision for faster training
  threading:
    prefer_physical_cores: true
    reserve_cores: 1
    max_threads: null
    optuna_parallel_trials: 1
    dl_num_workers: auto
    dl_pin_memory: auto
    dl_persistent_workers: true
    dl_prefetch_factor: 2
