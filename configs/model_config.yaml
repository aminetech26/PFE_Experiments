# Model configuration — all hyperparameters for R1/R2/R3 tournament
# Modify experiment params here; training code reads from this file.

experiment:
  seed: 42
  n_cv_folds: 5
  cv_gap: 5          # windows to drop between folds (temporal CV)
  mlflow_experiment: "PV-FDD-PFE-2026"

# ============================================================================
# TASK A — Anomaly Detection
# ============================================================================
anomaly_detection:
  # Runtime decomposition: ml and dl (no baseline namespace)
  ml:
    active_model: one_class_svm
    hpo:
      direction: maximize
      validation_mode: holdout
      sampler: tpe
      pruner: none
      study_name_prefix: anomaly_ml
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_ml.db"
      n_trials_phase1: 50
      timeout_seconds: null
    models:
      isolation_forest:
        scaling: standard
        max_train_samples: null
        contamination: auto
        n_jobs: -1
        bootstrap: false
        warm_start: false
        search_space:
          n_estimators: {type: int, low: 400, high: 1000, step: 100}
          max_samples: {type: categorical, choices: [1024, 2048, 4096, auto]}
          max_features: {type: float, low: 0.4, high: 0.8, step: 0.1}
      one_class_svm:
        scaling: standard          # StandardScaler fitted on train only
        max_train_samples: 20000   
        cache_size_mb: 1000
        shrinking: true
        tol: 1.0e-3
        kernels:
          rbf:
            nu: {type: float, low: 0.03, high: 0.10, log: true}
            gamma: {type: float, low: 0.01, high: 0.08, log: true}
          poly:
            degree: 3              # cubic — fixed
            nu: {type: float, low: 0.01, high: 0.20, log: true}
            gamma: {type: categorical, choices: [scale, auto, 0.01, 0.1]}
            coef0: {type: float, low: 0.0, high: 1.0}
      bocd:
        hazard_lambda: [100, 500]
      switching_kalman:
        n_states: [2, 4]
        transition_stickiness: [0.90, 0.99]

  dl:
    active_model: lstm_autoencoder
    hpo:
      mode: auto_two_stage
      sampler: tpe
      pruner: hyperband
      validation_mode: holdout
      early_stopping: true
      study_name_prefix: anomaly_dl
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_dl.db"
      run_stage3: false
      trial_budget:
        stage1_training: 20
        stage2_architecture: 40
        stage3_joint: 12
    models:
      lstm_autoencoder:
        hidden_dim: [32, 64, 128]
        num_layers: [2, 3]
      seq2seq_autoencoder:
        hidden_dim: [64, 128]
        num_layers: [2, 3]
      ssm:
        d_model: [64, 128]
        n_layers: [2, 4]

  primary_metric: pr_auc   # PR-AUC (not ROC) due to 97% normal class
  threshold_calibration: pr_curve  # use precision-recall to set alarm threshold

# ============================================================================
# TASK B — Fault Classification
# ============================================================================
classification:
  # Runtime decomposition: ml and dl (no baseline namespace)
  ml:
    active_model: lightgbm
    models:
      lightgbm:
        n_estimators: [200, 500]
        learning_rate: [0.05, 0.1]
        num_leaves: [31, 63]
        subsample: [0.8, 1.0]
        colsample_bytree: [0.7, 1.0]
        reg_alpha: [1.0e-8, 10.0]
        reg_lambda: [1.0e-8, 10.0]
        min_child_samples: [10, 100]
      xgboost:
        n_estimators: [200, 500]
        learning_rate: [0.03, 0.1]
        max_depth: [4, 8]
      catboost:
        iterations: [300, 500]
        depth: [6, 8]
        learning_rate: [0.05, 0.1]
      extra_trees:
        n_estimators: [200, 500]
        max_features: [sqrt, log2]
    hpo:
      direction: maximize
      validation_mode: holdout      # holdout | segment_temporal_cv
      sampler: tpe                  # ML policy default
      pruner: none                  # ML policy: no pruner
      study_name_prefix: classification_lightgbm
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_ml.db"
      n_trials_phase1: 50
      timeout_seconds: null

  dl:
    active_model: tcn
    hpo:
      mode: auto_two_stage        # transparent orchestration: stage1 -> stage2 -> optional stage3
      sampler: tpe
      pruner: hyperband
      validation_mode: holdout
      early_stopping: true
      study_name_prefix: classification_dl
      storage_url: "sqlite:////content/drive/MyDrive/PV-FDD/optuna/db/optuna_dl.db"
      run_stage3: false
      trial_budget:
        stage1_training: 20
        stage2_architecture: 40
        stage3_joint: 12
    models:
      cnn_1d:
        filters: [32, 64, 128]
        kernel_sizes: [3, 5]
        n_blocks: [2, 3, 4]
      gru:
        hidden_dim: [64, 128, 256]
        num_layers: [2, 3]
      lstm:
        hidden_dim: [64, 128, 256]
        num_layers: [2, 3]
      tcn:
        n_filters: [64, 128]
        kernel_size: [3, 5]
        n_levels: [4, 6]

  primary_metric: f1_weighted

# ============================================================================
# TASK C — Dropped (April 2026)
# Performance forecasting residuals are structurally identical to reconstruction-
# based anomaly detection (the family used in Task A). It is NOT a separate task.
# Forecasting-based residuals may appear as ONE METHOD within Task A experiments,
# not as a standalone contribution. Project scope is FDD: Task A + Task B.
# ============================================================================

# ============================================================================
# MULTI-TASK LEARNING (Task A + Task B shared encoder)
# ============================================================================
multitask:
  enabled: false           # Reserved for R2 phase once baselines are established
  shared_encoder:
    type: gru              # or tcn
    hidden_dim: 128
    num_layers: 3
  task_weights:
    anomaly: 1.0
    classification: 1.0
  weight_tuning: optuna    # tune α, β via Optuna

# ============================================================================
# TRAINING
# ============================================================================
training:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  scheduler: cosine_annealing_warmup
  warmup_steps: 100
  max_epochs: 100
  patience: 15             # early stopping
  batch_size: 256
  gradient_clip_val: 1.0
  precision: 16-mixed       # mixed precision for faster training
  threading:
    prefer_physical_cores: true
    reserve_cores: 1
    max_threads: null
    optuna_parallel_trials: 1
