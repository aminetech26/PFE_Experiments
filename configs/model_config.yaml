# Model configuration — all hyperparameters for R1/R2/R3 tournament
# Modify experiment params here; training code reads from this file.

experiment:
  seed: 42
  n_cv_folds: 5
  cv_gap: 5          # windows to drop between folds (temporal CV)
  mlflow_experiment: "PV-FDD-PFE-2026"

# ============================================================================
# TASK A — Anomaly Detection
# ============================================================================
anomaly_detection:
  primary_metric: pr_auc   # PR-AUC (not ROC) due to 97% normal class

  r1_models:               # Round 1: fast ML baselines
    isolation_forest:
      n_estimators: [100, 200]
      contamination: [0.03, 0.05, 0.10]
    one_class_svm:
      kernel: [rbf]
      nu: [0.03, 0.05, 0.10]

  r2_models:               # Round 2: DL
    lstm_autoencoder:
      hidden_dim: [32, 64, 128]
      num_layers: [2, 3]
      latency_budget_ms: 50  # Jetson Nano constraint

  threshold_calibration: pr_curve  # use precision-recall to set alarm threshold

# ============================================================================
# TASK B — Fault Classification
# ============================================================================
classification:
  active_model: lightgbm
  primary_metric: f1_weighted

  r1_models:
    lightgbm:
      n_estimators: [200, 500]
      learning_rate: [0.05, 0.1]
      num_leaves: [31, 63]
      subsample: [0.8, 1.0]
      colsample_bytree: [0.7, 1.0]
      reg_alpha: [1.0e-8, 10.0]
      reg_lambda: [1.0e-8, 10.0]
      min_child_samples: [10, 100]
    catboost:
      iterations: [300, 500]
      depth: [6, 8]
      learning_rate: [0.05, 0.1]
    extra_trees:
      n_estimators: [200, 500]
      max_features: [sqrt, log2]

  r2_models:
    cnn_1d:
      filters: [32, 64, 128]
      kernel_sizes: [3, 5]
      n_blocks: [2, 3, 4]
    gru:
      hidden_dim: [64, 128, 256]
      num_layers: [2, 3]
    tcn:
      n_filters: [64, 128]
      kernel_size: [3, 5]
      n_levels: [4, 6]

  hpo:
    sampler: tpe
    direction: maximize
    n_trials_phase1: 50
    timeout_seconds: null

# ============================================================================
# TASK C — Fault Forecasting
# ============================================================================
forecasting:
  primary_metric: mae
  horizons_min: [5, 10]

  r1_models:
    xgboost_lag:
      n_lags: [12, 24, 48]    # lookback windows
      n_estimators: [200, 500]

  r2_models:
    lstm:
      hidden_dim: [64, 128]
      num_layers: [2, 3]
    gru:
      hidden_dim: [64, 128]
      num_layers: [2, 3]

  foundation_models:       # Zero-shot benchmarks only
    time_moe:
      mode: zero_shot
      note: "Evaluate as upper bound reference — NOT deployed to Jetson"
    timesfm:
      mode: zero_shot
      note: "Same — zero-shot reference only"

# ============================================================================
# MULTI-TASK LEARNING
# ============================================================================
multitask:
  enabled: true
  shared_encoder:
    type: gru              # or tcn
    hidden_dim: 128
    num_layers: 3
  task_weights:
    anomaly: 1.0
    classification: 1.0
    forecasting: 1.0
  weight_tuning: optuna    # tune α, β, γ via Optuna

# ============================================================================
# TRAINING
# ============================================================================
training:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  scheduler: cosine_annealing_warmup
  warmup_steps: 100
  max_epochs: 100
  patience: 15             # early stopping
  batch_size: 256
  gradient_clip_val: 1.0
  precision: 16-mixed       # mixed precision for faster training
  threading:
    prefer_physical_cores: true
    reserve_cores: 1
    max_threads: null
    optuna_parallel_trials: 1
