# =============================================================================
# DATA CONFIGURATION
# Controls dataset loading, splitting, preprocessing, and feature engineering.
# All pipeline scripts read from here — modify here, not in code.
#
# Resolution order for per-stage settings:
#   global default  <  dataset override  <  task_directive  <  profile override
# =============================================================================

# Active dataset for pipeline defaults. CLI flags can still override this.
active_dataset: costa

# -----------------------------------------------------------------------------
# PATHS
# -----------------------------------------------------------------------------
paths:
  raw_dir:       "data/raw"
  interim_dir:   "data/interim"
  processed_dir: "data/processed"

  # ---------------------------------------------------------------------------
  # DATASET REGISTRY
  # One entry per dataset. Each entry defines:
  #   - where raw files live (dir, relative to raw_dir)
  #   - where ingested parquet lives (merged_output, relative to interim_dir)
  #   - standard schema mapping (label_col, timestamp_col)
  #   - dataset-specific overrides for splits / preprocessing / features / EDA
  #
  # Standard output schema after ingestion:
  #   timestamp | label | segment_id | <sensor_cols>
  #
  # Directory layout:
  #   data/interim/ingestion/<dataset>/   ← ingestion outputs
  #   data/interim/splits/<dataset>/      ← split outputs
  #   data/interim/eda/<dataset>/         ← EDA outputs
  #   data/processed/preprocessed/<dataset>/
  #   data/processed/features/<dataset>/
  # ---------------------------------------------------------------------------
  datasets:

    # -------------------------------------------------------------------------
    # LA RÉUNION — Real labeled faults, ~7 s sampling, inverter data
    # Source: University of La Réunion
    # -------------------------------------------------------------------------
    la_reunion:
      dir: "University of La Réunion Data"   # relative to raw_dir
      merged_output: "ingestion/la_reunion/reunion_dt2_merged.parquet"  # relative to interim_dir
      label_col:     "label"
      timestamp_col: "timestamp"
      sampling_hz:   0.143    # ~7 s intervals

      eda_findings_path: "data/interim/eda/la_reunion/eda_feature_findings.json"

      splits:
        # Fault classes with ≥3 segments → evaluable in val/test
        evaluable_classes:  [3.1, 3.2, 4.0]
        # Fault classes with <3 segments → training contribution only (Task A)
        train_only_classes: [1.0, 2.1, 2.2, 2.3]
        # Gap threshold: >5 min between consecutive rows → new segment
        segmentation_gap_seconds: 300

      preprocessing:
        stationarity:
          # Power and current / GTI ≈ efficiency and yield coefficients (diurnal-invariant)
          irradiance_normalize:
            features:    [Pg, Ig, Eg, Fg, Ia]
            denominator: GTI
            suffix:      _norm
          # Temperature residualization: TA/TPV - (β·GTI + α), OLS on normal train.
          # Removes irradiance-driven thermal loading; residual captures anomalous
          # deviations from the physics-predicted temperature baseline.
          irr_residualize:
            features: [TA, TPV]
            irr_col:  GTI
            suffix:   _irr_residual

      feature_engineering:
        sensor_columns: [Pg, Vg, Ig, Eg, Fg, Ia, GTI, TA, TPV]
        flags:
          enable_hour_cyclic:        true   # real timestamps, time-of-day is meaningful
          enable_delta_temp:         true   # TA and TPV both present
          enable_dP_dt:              true
          enable_dV_dt:              true
          enable_dI_dt:              true
          enable_Vg_normalized:      true
          enable_differential_signal: false  # requires dt3 (healthy inverter ref)
        selection:
          anchor_features: [delta_temp, dP_dt, dV_dt, dI_dt]

    # -------------------------------------------------------------------------
    # COSTA — Real labeled faults, 1 Hz, 2-string grid-tied PV plant (Brazil)
    # Source: Costa et al., Sensors 20(17) 4688 (2020)
    # Labels: 0=Normal 1=ShortCircuit 2=Degradation 3=OpenCircuit 4=Shadowing
    # Note: label 4 (Shadowing) is NATURAL, not artificially induced.
    # Faults 1-3: artificially induced ~10-min blocks, daytime only.
    # Ingestion trims Costa to irr >= 100 W/m² to retain meaningful operating
    # conditions and match the paper-scale daytime subset (~516k rows).
    # Timestamp: synthetic 1 Hz, epoch 2020-04-06T03:38:00Z.
    #   Raw .mat files do not expose trustworthy wall-clock timestamps.
    #   This epoch is a solar-aligned synthetic anchor chosen so irradiance peaks
    #   land near plausible local solar noon for Curitiba (lat -25.438686,
    #   lon -49.268487). Treat relative timing as trustworthy; absolute clock
    #   semantics remain approximate.
    # -------------------------------------------------------------------------
    costa:
      dir: "Costa PV Fault Dataset"         # relative to raw_dir
      merged_output: "ingestion/costa/costa_merged.parquet"  # relative to interim_dir
      label_col:     "label"
      timestamp_col: "timestamp"
      sampling_hz:   1.0
      daytime_irr_threshold_wm2: 100.0

      eda_findings_path: "data/interim/eda/costa/eda_feature_findings.json"

      splits:
        evaluable_classes:  [1, 2, 3, 4]   # all four fault types — integer labels
        train_only_classes: []
        segmentation_gap_seconds: 300
        atomic_group_col: episode_id
        continuity_group_col: continuity_segment_id
        comparison_paths:
          path_b:
            enabled: true
            atomic_group_col: operating_day_id
            purge_days: 0
            forward_boundary_purge_fraction: 0.5

      preprocessing:
        missing_values:
          enabled: false
        physics_normalization: null

      feature_engineering:
        sensor_columns: [vdc1, vdc2, idc1, idc2, pdc1, pdc2, pdc, irr, pvt]
        flags:
          enable_hour_cyclic:        false  # Path A default off; Path B optional only
          enable_delta_temp:         false  # no ambient temp sensor (only pvt)
          enable_dP_dt:              true
          enable_dV_dt:              true
          enable_dI_dt:              true
          enable_Vg_normalized:      false  # no grid voltage sensor in Costa
          enable_power_imbalance:    true
          enable_current_imbalance:  true
          enable_voltage_imbalance:  true
          enable_string_share:       false
          enable_temp_power_correction: true
          temp_ref_c:                25.0
          gamma_pmax_pct_per_c:      -0.40  # CS6U-330P datasheet (Pmax temp coeff)
          temp_power_eps:            1e-8
          irr_norm_floor:            1.0
          enable_differential_signal: false  # single-inverter dataset
        selection:
          anchor_features:
            [dP_dt, dV_dt, dI_dt, power_imbalance, current_imbalance, voltage_imbalance, pdc_temp_corrected_norm_irr]

    # -------------------------------------------------------------------------
    # MENDELEY / GPVS-FAULTS — Lab experiments, ~10 kHz → 1 kHz, grid-connected
    # Source: Bakdi et al., Int. J. Electrical Power & Energy Systems (2020)
    # 16 experiments: F0-F7 × {L=IPPT, M=MPPT}
    # Labels: 0=Normal (F0 files + pre-fault halves), 1-7=seven fault types
    # Fault injection: MANUALLY at experiment midpoint.
    #   Use phase=="fault" for active-fault samples, fault_class==0 for clean normal.
    # Timestamp: synthetic UTC, epoch 2021-01-01T00:00Z, 1-hour windows per experiment.
    #   Each experiment is ~14.4 s → 16 segments after gap-based segmentation.
    # -------------------------------------------------------------------------
    mendeley:
      dir: "GPVS-Faults/CSV_Files"          # relative to raw_dir
      merged_output: "ingestion/mendeley/mendeley_merged.parquet"  # relative to interim_dir
      label_col:     "label"
      timestamp_col: "timestamp"
      sampling_hz:   1000.0   # downsampled from ~10 kHz to 1 kHz during ingestion

      eda_findings_path: "data/interim/eda/mendeley/eda_feature_findings.json"

      splits:
        evaluable_classes:  [1, 2, 3, 4, 5, 6, 7]  # all seven fault types
        train_only_classes: []
        # Within-experiment dt ≈ 1 ms; between-experiment gap ≈ 3585 s.
        # 300 s threshold correctly yields 1 segment per experiment (16 total).
        segmentation_gap_seconds: 300
        # For classification: recommend filtering phase=="fault" for fault samples
        # and fault_class==0 for normal samples (avoids pre-fault contamination).
        phase_filter_recommended: true

      preprocessing:
        stationarity:
          # No irradiance sensor in Mendeley — skip irradiance normalization
          irradiance_normalize: null
          # Simulated data: no thermal drift across 14.4 s experiments
          polynomial_detrend: null

      feature_engineering:
        # DC-side PV: Ipv, Vpv, Vdc. AC-side: ia/ib/ic, va/vb/vc.
        # Positive-sequence phasors: Iabc, If, Vabc, Vf.
        sensor_columns: [Ipv, Vpv, Vdc, ia, ib, ic, va, vb, vc, Iabc, If, Vabc, Vf]
        flags:
          enable_hour_cyclic:        false  # synthetic timestamps, no real time-of-day
          enable_delta_temp:         false  # no temperature sensor
          enable_dP_dt:              true   # Ipv*Vpv is PV power — rate useful
          enable_dV_dt:              true
          enable_dI_dt:              true
          enable_Vg_normalized:      false  # no GTI/irradiance reference
          enable_differential_signal: false
        selection:
          anchor_features: [dP_dt, dV_dt, dI_dt]


# =============================================================================
# GLOBAL SPLIT DEFAULTS
# Overridden per-dataset under paths.datasets.<dataset>.splits
# =============================================================================
splits:
  seed:        42
  train_ratio: 0.70
  val_ratio:   0.15
  test_ratio:  0.15
  embargo_seconds: 1260    # 21 min embargo between train and val/test boundaries


# =============================================================================
# GLOBAL PREPROCESSING DEFAULTS
# Applied when a dataset does not define an override for a given key.
# Dataset-specific overrides live under paths.datasets.<dataset>.preprocessing
# =============================================================================
preprocessing:
  # --- Missing Value Handling ---
  # Tiered strategy: ffill for short gaps, interpolate for medium, drop for long.
  # NEVER impute on fault-labeled rows — would fabricate fault signatures.
  missing_values:
    ffill_max_gap_seconds:  60    # < 1 min  → forward-fill (normal only)
    interp_max_gap_seconds: 300   # 1-5 min  → linear interpolation (normal only)
    # > 5 min OR any fault gap → DROP rows

  # --- Outlier Treatment ---
  # IQR 3× is conservative — only catches far outliers (sensor errors).
  # Fault data outliers are expected fault signatures — never winsorize them.
  outliers:
    method:           iqr_winsorize   # IQR detection + percentile clamp
    iqr_multiplier:   3.0
    lower_percentile: 0.05
    upper_percentile: 0.95
    scope:            normal_only

  # --- Physics Normalization (global fallback — override per dataset) ---
  stationarity:
    irradiance_normalize: null
    irr_residualize:      null


# =============================================================================
# GLOBAL FEATURE ENGINEERING DEFAULTS
# Dataset-specific flag/selection overrides live under
# paths.datasets.<dataset>.feature_engineering
# Profile and task_directive overrides layer on top.
# =============================================================================
feature_engineering:

  # Global flag defaults — overridden by dataset, then profile, then task_directive
  flags:
    enable_hour_cyclic:        true
    enable_delta_temp:         true
    enable_dP_dt:              true
    enable_dV_dt:              true
    enable_dI_dt:              true
    enable_Vg_normalized:      true
    enable_power_imbalance:    false
    enable_current_imbalance:  false
    enable_voltage_imbalance:  false
    enable_string_share:       false
    enable_temp_power_correction: false
    temp_ref_c:                25.0
    gamma_pmax_pct_per_c:      -0.40
    temp_power_eps:            1e-8
    irr_norm_floor:            1.0
    enable_hygiene_pruning:    false
    enable_mrmr_selection:     false
    mrmr_k:                    64
    enable_corr_pruning:       false
    enable_vif_pruning:        false
    enable_wavelet:            false
    wavelet_threshold_strategy: per_segment   # per_segment | global
    enable_rolling_stats:      false
    rolling_windows:           [5, 10, 30]
    rolling_stats:             [mean, std, min, max]   # available: mean std min max median range skew kurtosis rms zcr

    enable_explicit_windowing: false
    window_size:               60
    window_step:               30
    enable_multiscale:         false
    multiscale_window_sizes:   [60, 30, 10]
    enable_wpd:                false         # Wavelet Packet Decomp subband energies; Path B only
    wpd_level:                 3             # 2^level subbands (level 3 → 8 bands)
    wpd_wavelet:               db4
    enable_ceemdan:            false         # CEEMDAN IMF energy ratios; Path B only; slow
    ceemdan_n_imfs:            3
    ceemdan_n_ensemble:        20
    spectral_min_fs:           0.5           # Hz — spectral methods auto-skip below this rate

    enable_differential_signal: false

  selection:
    corr_threshold: 0.95
    vif_threshold:  10.0
    max_vif_rows:   50000
    near_constant_std: 1e-10
    # anchor_features: overridden per dataset (dataset has the right column names)
    anchor_features: [dP_dt, dV_dt, dI_dt]   # safe global default
    use_eda_findings:                    true
    # eda_findings_path: resolved from paths.datasets.<dataset>.eda_findings_path at runtime
    # EDA is advisory for FE design and anchor protection; it is no longer an auto-drop layer.
    eda_prefer_anchors_from_findings:    true
    eda_pre_drop_candidates:             false
    eda_override_thresholds:             false
    eda_apply_predrop_before_feature_generation: false
    eda_block_derived_from_predropped_sources:   false

  tsfresh:
    mode:                minimal   # off | minimal | extensive
    top_k:               20
    n_segments_sample:   60
    max_rows_per_segment: 800
    n_jobs:              1

  outputs:
    root_dir:    data/processed/features
    runs_subdir: runs

  # ---------------------------------------------------------------------------
  # TASK DIRECTIVES
  # Overrides layered on top of base flags/selection/tsfresh per task.
  # Resolution: global defaults → dataset overrides → task_directive → profile
  # ---------------------------------------------------------------------------
  task_directives:
    default_task: classification

    common:
      flags: {}
      selection: {}
      tsfresh: {}
      eda:
        mi_top_key:      top_features_binary
        use_mannwhitney: true
      tsfresh_label_strategy: any_fault

    anomaly_semisup:
      eda:
        mi_top_key:      top_features_binary
        use_mannwhitney: true

    anomaly_supervised:
      eda:
        mi_top_key:      top_features_binary
        use_mannwhitney: true

    classification:
      eda:
        mi_top_key:      top_features_multiclass
        use_mannwhitney: false
      tsfresh_label_strategy: majority_label

  # ---------------------------------------------------------------------------
  # ABLATION PROFILES
  # Named feature sets for systematic ablation experiments.
  # Additive layers: baseline_raw < plus_physics < plus_temporal
    #   row-aligned track:  < plus_rolling
    #   windowed track:     < plus_windowed < plus_multiscale
    #                       < plus_wpd (Path B only)
    #                       < plus_ceemdan (Path B only, slow)
    #                       < plus_wpd_ceemdan (Path B only, hybrid)
    #                       < plus_all (Path B richest combined profile)
  # Run: uv run python -m src.data.featurize_pipeline --profile <name> --task <task>
  # ---------------------------------------------------------------------------
  profiles:
    baseline_raw:
      enable_hour_cyclic:         false
      enable_delta_temp:          false
      enable_dP_dt:               false
      enable_dV_dt:               false
      enable_dI_dt:               false
      enable_Vg_normalized:       false
      enable_power_imbalance:     false
      enable_current_imbalance:   false
      enable_voltage_imbalance:   false
      enable_string_share:        false
      enable_temp_power_correction: false
      enable_corr_pruning:        false
      enable_vif_pruning:         false
      enable_wavelet:             false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      tsfresh_mode:               "off"

    plus_physics:
      enable_hour_cyclic:         false
      enable_delta_temp:          true
      enable_dP_dt:               true
      enable_dV_dt:               true
      enable_dI_dt:               true
      enable_Vg_normalized:       true
      enable_power_imbalance:     true
      enable_current_imbalance:   true
      enable_voltage_imbalance:   true
      enable_string_share:        false
      enable_temp_power_correction: true
      temp_ref_c:                 25.0
      gamma_pmax_pct_per_c:       -0.40
      temp_power_eps:             1e-8
      irr_norm_floor:             1.0
      enable_hygiene_pruning:     true
      enable_mrmr_selection:      true
      mrmr_k:                     64
      enable_corr_pruning:        false
      enable_vif_pruning:         false
      enable_wavelet:             false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      tsfresh_mode:               "off"

    plus_temporal:
      enable_hour_cyclic:         true
      enable_delta_temp:          true
      enable_dP_dt:               true
      enable_dV_dt:               true
      enable_dI_dt:               true
      enable_Vg_normalized:       true
      enable_power_imbalance:     true
      enable_current_imbalance:   true
      enable_voltage_imbalance:   true
      enable_temp_power_correction: true
      temp_ref_c:                 25.0
      gamma_pmax_pct_per_c:       -0.40
      temp_power_eps:             1e-8
      irr_norm_floor:             1.0
      enable_corr_pruning:        false
      enable_vif_pruning:         false
      enable_wavelet:             false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      tsfresh_mode:               "off"

    plus_differential:
      enable_hour_cyclic:         true
      enable_delta_temp:          true
      enable_dP_dt:               true
      enable_dV_dt:               true
      enable_dI_dt:               true
      enable_Vg_normalized:       true
      enable_corr_pruning:        false
      enable_vif_pruning:         false
      enable_wavelet:             false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: true   # runtime-disabled for costa (no healthy-reference channel)
      tsfresh_mode:               "off"

    plus_rolling:
      enable_hour_cyclic:         true
      enable_delta_temp:          true
      enable_dP_dt:               true
      enable_dV_dt:               true
      enable_dI_dt:               true
      enable_Vg_normalized:       true
      enable_power_imbalance:     true
      enable_current_imbalance:   true
      enable_voltage_imbalance:   true
      enable_temp_power_correction: true
      temp_ref_c:                 25.0
      gamma_pmax_pct_per_c:       -0.40
      temp_power_eps:             1e-8
      irr_norm_floor:             1.0
      enable_corr_pruning:        false
      enable_vif_pruning:         false
      enable_wavelet:             false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      enable_rolling_stats:       true
      rolling_windows:            [5, 10, 30]
      rolling_stats:              [mean, std, min, max, rms, zcr]
      tsfresh_mode:               "off"

    plus_windowed:
      enable_hour_cyclic:         true
      enable_delta_temp:          true
      enable_dP_dt:               true
      enable_dV_dt:               true
      enable_dI_dt:               true
      enable_Vg_normalized:       true
      enable_power_imbalance:     true
      enable_current_imbalance:   true
      enable_voltage_imbalance:   true
      enable_temp_power_correction: true
      temp_ref_c:                 25.0
      gamma_pmax_pct_per_c:       -0.40
      temp_power_eps:             1e-8
      irr_norm_floor:             1.0
      enable_corr_pruning:        false
      enable_vif_pruning:         false
      enable_wavelet:             false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      enable_rolling_stats:       false   # auto-disabled by windowing policy anyway
      enable_explicit_windowing:  true
      window_size:                60
