# Data configuration — controls all dataset loading and splitting
# Modify here, not in code, to keep experiments consistent.

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

  # Dataset registry — one entry per dataset.
  # Each entry defines where raw files live and which columns map to the standard schema.
  # Standard schema downstream: timestamp | label | segment_id + sensor columns
  # Ingestion outputs live under interim_dir/ingestion/<dataset>/
  # Split outputs live under interim_dir/splits/<dataset>/
  # EDA outputs live under interim_dir/eda/<dataset>/
  datasets:
    la_reunion:
      dir: "University of La Réunion Data"                          # relative to raw_dir
      merged_output: "ingestion/la_reunion/reunion_dt2_merged.parquet"  # relative to interim_dir
      label_col: "Fault"
      timestamp_col: "time"
      sampling_hz: 0.143   # ~7s intervals

    costa:
      dir: "Costa PV Fault Dataset"                      # relative to raw_dir
      merged_output: "ingestion/costa/costa_merged.parquet"  # relative to interim_dir
      label_col: "label"          # standardised by load_costa() during ingestion
      timestamp_col: "timestamp"  # synthetic 1Hz, epoch 2020-01-01T03:38:00Z (≈01:38 BRST)
      sampling_hz: 1.0
      # Epoch derived from solar geometry (Curitiba lon 49.27°W → solar noon 15:17 UTC)
      # cross-checked with paper fault schedule → t0 = 03:38 UTC = 01:38 BRST (UTC-2).
      # Fault classes: 0=Normal 1=ShortCircuit 2=Degradation 3=OpenCircuit 4=Shadowing
      # Note: label 4 (Shadowing) is NATURAL (buildings/clouds), NOT artificially induced.
      # Faults 1-3 are artificially induced ~10-min blocks during daytime.
      # Use is_daytime column (irr > 5 W/m²) to filter nighttime rows upstream.

    mendeley:
      dir: "GPVS-Faults/CSV_Files"                          # relative to raw_dir
      merged_output: "ingestion/mendeley/mendeley_merged.parquet"  # relative to interim_dir
      label_col: "label"          # active fault label: 0=Normal, 1-7=fault class
      timestamp_col: "timestamp"  # synthetic UTC, epoch 2021-01-01T00:00Z, 1-hour windows
      sampling_hz: 1000.0         # downsampled from ~10 kHz to 1 kHz during ingestion
      # 16 experiments: F0-F7 × {L=IPPT, M=MPPT}. Each experiment ~14.4 s.
      # F0 files: fault-free (label=0). F1-F7: first half pre-fault (label=0),
      # second half active fault (label=fault_class). Use phase column to filter:
      #   phase=="fault" → active fault samples
      #   fault_class==0 → clean normal (F0 experiments only)
      # Columns: Ipv, Vpv, Vdc, ia, ib, ic, va, vb, vc, Iabc, If, Vabc, Vf
      # fault_class: raw fault index (0-7) independent of phase

splits:
  seed: 42
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  segmentation_gap_seconds: 300      # 5 min gap defines segment boundary

  # Evaluable fault classes (have ≥3 segments for train/val/test distribution)
  evaluable_classes: [3.1, 3.2, 4.0]
  
  # Train-only fault classes (insufficient segments, contribute to Task A only)
  train_only_classes: [1.0, 2.1, 2.2, 2.3]

# =============================================================================
# TASK C: PREDICTION CONFIGURATION
# =============================================================================

prediction:
  forecast_horizon_seconds: 1800     # 30 min — how far ahead to predict
  window_size_seconds: 3600          # 60 min — history used as features
  min_episodes_for_eval: 3           # Minimum episodes to be evaluable

# =============================================================================
# PREPROCESSING CONFIGURATION
# =============================================================================
# Based on EDA findings documented in PREPROCESSING_DECISIONS.md

preprocessing:
  # --- Missing Value Handling ---
  # Tiered strategy: ffill for short gaps, interpolate for medium, drop for long
  # Rule: NEVER impute on fault data (would fabricate fault signatures)
  missing_values:
    ffill_max_gap_seconds: 60          # < 1 min → forward-fill (normal only)
    interp_max_gap_seconds: 300        # 1-5 min → linear interpolation (normal only)
    # > 5 min → DROP rows
    # Any gap on fault data → DROP rows
  
  # --- Outlier Treatment ---
  # IQR 3× is conservative — only catches far outliers (sensor errors)
  # Fault data outliers are expected signatures, not errors
  outliers:
    method: iqr_winsorize                # IQR detection + percentile replacement
    iqr_multiplier: 3.0                  # 3× IQR for outlier detection
    lower_percentile: 0.05               # Replace outliers with 5th percentile
    upper_percentile: 0.95               # Replace outliers with 95th percentile
    scope: normal_only                   # don't touch fault data
  
  # --- Stationarity Correction ---
  # STL not applicable (segments < 2 seasonal cycles)
  # Use physics-based normalization instead
  stationarity:
    # Irradiance normalization: removes diurnal dependency
    # Power/GTI ≈ efficiency, which is ~constant throughout day
    irradiance_normalize:
      features: [Pg, Ig, Eg, Fg, Ia]   # power-related features
      denominator: GTI
      suffix: _norm
    
    # Polynomial detrending: removes curved thermal drift per segment
    polynomial_detrend:
      features: [TA, TPV]               # temperature features
      scope: per_segment
      suffix: _detrend
      degree: 2                         # polynomial degree (2=quadratic, better for curved temp patterns)

# =============================================================================
# FEATURE ENGINEERING CONFIGURATION
# =============================================================================

feature_engineering:
  # Per-component flags for ablation experiments (no code edits required)
  flags:
    enable_hour_cyclic: true
    enable_delta_temp: true
    enable_dP_dt: true
    enable_dV_dt: true
    enable_dI_dt: true
    enable_Vg_normalized: true
    enable_corr_pruning: true
    enable_vif_pruning: true
    enable_wavelet: false
    wavelet_threshold_strategy: per_segment   # per_segment | global
    include_preprocessed_stationarity_features: true
    preprocessed_stationarity_suffixes: ["_norm", "_detrend"]
    enable_differential_signal: false

  selection:
    corr_threshold: 0.95
    vif_threshold: 10.0
    max_vif_rows: 50000
    anchor_features: [delta_temp, dP_dt, dV_dt, dI_dt]
    use_eda_findings: true
    eda_findings_path: data/interim/eda/la_reunion/eda_feature_findings.json
    eda_prefer_anchors_from_findings: true
    eda_pre_drop_candidates: true
    eda_override_thresholds: false
    eda_apply_predrop_before_feature_generation: true
    eda_block_derived_from_predropped_sources: true

  tsfresh:
    mode: minimal               # off | minimal | extensive
    top_k: 20
    n_segments_sample: 60
    max_rows_per_segment: 800
    n_jobs: 1

  outputs:
    root_dir: data/processed/features
    runs_subdir: runs

  # Task-specific overrides layered on top of base flags/selection/tsfresh.
  # Resolution order: base config -> profile overrides -> common -> selected task.
  task_directives:
    default_task: classification
    common:
      flags: {}
      selection: {}
      tsfresh: {}
      eda:
        mi_top_key: top_features_binary
        use_mannwhitney: true
      tsfresh_label_strategy: any_fault

    anomaly_semisup:
      eda:
        mi_top_key: top_features_binary
        use_mannwhitney: true

    anomaly_supervised:
      eda:
        mi_top_key: top_features_binary
        use_mannwhitney: true

    classification:
      eda:
        mi_top_key: top_features_multiclass
        use_mannwhitney: false
      tsfresh_label_strategy: majority_label

    prediction:
      selection:
        eda_prefer_anchors_from_findings: false
        eda_pre_drop_candidates: false
      eda:
        mi_top_key: top_features_binary
        use_mannwhitney: false
      tsfresh_label_strategy: any_fault

  profiles:
    baseline_raw:
      enable_hour_cyclic: false
      enable_delta_temp: false
      enable_dP_dt: false
      enable_dV_dt: false
      enable_dI_dt: false
      enable_Vg_normalized: false
      enable_corr_pruning: false
      enable_vif_pruning: false
      enable_wavelet: false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      tsfresh_mode: "off"
    plus_physics:
      enable_hour_cyclic: false
      enable_delta_temp: true
      enable_dP_dt: true
      enable_dV_dt: true
      enable_dI_dt: true
      enable_Vg_normalized: true
      enable_corr_pruning: true
      enable_vif_pruning: true
      enable_wavelet: false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      tsfresh_mode: "off"
    plus_temporal:
      enable_hour_cyclic: true
      enable_delta_temp: true
      enable_dP_dt: true
      enable_dV_dt: true
      enable_dI_dt: true
      enable_Vg_normalized: true
      enable_corr_pruning: true
      enable_vif_pruning: true
      enable_wavelet: false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      tsfresh_mode: "off"
    plus_tsfresh_minimal:
      enable_hour_cyclic: true
      enable_delta_temp: true
      enable_dP_dt: true
      enable_dV_dt: true
      enable_dI_dt: true
      enable_Vg_normalized: true
      enable_corr_pruning: true
      enable_vif_pruning: true
      enable_wavelet: false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      tsfresh_mode: "minimal"
    plus_tsfresh_extensive:
      enable_hour_cyclic: true
      enable_delta_temp: true
      enable_dP_dt: true
      enable_dV_dt: true
      enable_dI_dt: true
      enable_Vg_normalized: true
      enable_corr_pruning: true
      enable_vif_pruning: true
      enable_wavelet: false
      wavelet_threshold_strategy: per_segment
      enable_differential_signal: false
      tsfresh_mode: "extensive"
    plus_wavelet:
      enable_hour_cyclic: true
