# Data configuration — controls all dataset loading and splitting
# Modify here, not in code, to keep experiments consistent.

paths:
  raw_dir: "data/raw"
  reunion: "University of La Réunion Data"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

splits:
  seed: 42
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  segmentation_gap_seconds: 300      # 5 min gap defines segment boundary
  daytime_gti_threshold: 10.0        # W/m², filter nighttime

  # Evaluable fault classes (have ≥3 segments for train/val/test distribution)
  evaluable_classes: [3.1, 3.2, 4.0]
  
  # Train-only fault classes (insufficient segments, contribute to Task A only)
  train_only_classes: [1.0, 2.1, 2.2, 2.3]

# =============================================================================
# TASK C: PREDICTION CONFIGURATION
# =============================================================================

prediction:
  forecast_horizon_seconds: 1800     # 30 min — how far ahead to predict
  window_size_seconds: 3600          # 60 min — history used as features
  min_episodes_for_eval: 3           # Minimum episodes to be evaluable

# =============================================================================
# FEATURE CONFIGURATION
# =============================================================================

features:
  reunion:
    electrical: [Ia, Ig, Eg, Fg, Pg, Va, Vg]
    meteorological: [GTI, DTI, TA, TPV]
    physics: [performance_ratio, delta_temp, dP_dt, dV_dt, dI_dt, Vg_normalized]

window:
  size: 60          # timesteps per window
  step: 30          # stride (50% overlap)

label_columns:
  reunion: Fault    # 0.0=normal, 1.0-4.0=fault types

scaling:
  method: robust    # RobustScaler (outlier-resistant)
  fit_on: train     
