stages:
  # Stage 0: Data Ingestion → Parquet
  ingest:
    cmd: python -m src.data.ingestion
    deps:
      - src/data/ingestion.py
      - data/raw/University of La Réunion Data/dt1_solar_and_meteorological_measurement.csv
      - data/raw/University of La Réunion Data/dt2_electrical_production_inverter_1_with_faults.csv
      - data/raw/University of La Réunion Data/dt3_electrical_production_inverter_2.csv
    outs:
      - data/interim/reunion_dt2_merged.parquet
      - data/interim/reunion_dt3_merged.parquet

  # Stage 1: Temporal Split (segment-aware + embargo)
  split:
    cmd: python -m src.data.split_pipeline
    deps:
      - src/data/splitting.py
      - src/data/split_pipeline.py
      - data/interim/reunion_dt2_merged.parquet
      - configs/data_config.yaml
    outs:
      - data/processed/splits/train_raw.parquet
      - data/processed/splits/val_raw.parquet
      - data/processed/splits/test_raw.parquet
      - data/processed/splits/dropped_embargo_raw.parquet
      - data/processed/splits/split_manifest.json

  # Stage 2: Feature Engineering (post-split, deterministic)
  featurize:
    cmd: python -m src.data.featurize_pipeline
    deps:
      - src/data/features.py
      - src/data/featurize_pipeline.py
      - data/processed/splits/train_raw.parquet
      - data/processed/splits/val_raw.parquet
      - data/processed/splits/test_raw.parquet
      - data/interim/reunion_dt3_merged.parquet
      - configs/data_config.yaml
    outs:
      - data/processed/splits/train.parquet
      - data/processed/splits/val.parquet
      - data/processed/splits/test.parquet
      - data/processed/splits/featurize_manifest.json

  # Stage 3: Baseline ML Models
  train_baselines:
    cmd: python -m src.models.train_baselines
    deps:
      - src/data/features.py
      - src/evaluation/leakage_checks.py
      - src/models/train_baselines.py
      - data/processed/splits/train.parquet
      - data/processed/splits/val.parquet
      - data/processed/splits/test.parquet
      - data/processed/splits/split_manifest.json
      - data/processed/splits/featurize_manifest.json
      - configs/data_config.yaml
      - configs/model_config.yaml
    metrics:
      - experiments/metrics/baseline_results.json:
          cache: false
    outs:
      - data/processed/preprocessor.pkl

  # Stage 4: DL Models
  train_dl:
    cmd: python -m src.models.train_dl
    deps:
      - src/models/train_dl.py
      - data/processed/splits/train.parquet
      - data/processed/splits/val.parquet
      - data/processed/splits/test.parquet
      - configs/model_config.yaml
    metrics:
      - experiments/metrics/dl_results.json:
          cache: false
    outs:
      - experiments/checkpoints/best_model.pt

  # Stage 5: ONNX Export
  export_onnx:
    cmd: python -m src.deployment.export_onnx
    deps:
      - src/deployment/export_onnx.py
      - experiments/checkpoints/best_model.pt
      - configs/deploy_config.yaml
    outs:
      - experiments/deployment/model.onnx
