stages:
  # Stage 0: Data Ingestion → Parquet
  ingest:
    cmd: uv run python -m src.data.ingestion
    deps:
      - src/data/ingestion.py
      - data/raw/University of La Réunion Data/dt1_solar_and_meteorological_measurement.csv
      - data/raw/University of La Réunion Data/dt2_electrical_production_inverter_1_with_faults.csv
      - data/raw/University of La Réunion Data/dt3_electrical_production_inverter_2.csv
    outs:
      - data/interim/reunion_dt2_merged.parquet
      - data/interim/reunion_dt3_merged.parquet

  # Stage 1: Task-Specific Splits
  # Outputs 4 split types: anomaly_semisup, anomaly_supervised, classification, prediction
  # See SPLIT_DECISIONS.md for rationale
  split:
    cmd: uv run python -m src.data.split_pipeline
    deps:
      - src/data/splitting.py
      - src/data/split_pipeline.py
      - data/interim/reunion_dt2_merged.parquet
      - configs/data_config.yaml
    outs:
      - data/interim/splits/anomaly_semisup/train.parquet
      - data/interim/splits/anomaly_semisup/val.parquet
      - data/interim/splits/anomaly_semisup/test.parquet
      - data/interim/splits/anomaly_semisup/split_manifest.json
      - data/interim/splits/anomaly_supervised/train.parquet
      - data/interim/splits/anomaly_supervised/val.parquet
      - data/interim/splits/anomaly_supervised/test.parquet
      - data/interim/splits/anomaly_supervised/split_manifest.json
      - data/interim/splits/classification/train.parquet
      - data/interim/splits/classification/val.parquet
      - data/interim/splits/classification/test.parquet
      - data/interim/splits/classification/split_manifest.json
      - data/interim/splits/prediction/train.parquet
      - data/interim/splits/prediction/val.parquet
      - data/interim/splits/prediction/test.parquet
      - data/interim/splits/prediction/split_manifest.json

  # Stage 2: Feature Engineering (post-split)
  featurize:
    cmd: uv run python -m src.data.featurize_pipeline
    deps:
      - src/data/features.py
      - src/data/featurize_pipeline.py
      - data/interim/splits/anomaly_supervised/train.parquet
      - data/interim/splits/anomaly_supervised/val.parquet
      - data/interim/splits/anomaly_supervised/test.parquet
      - configs/data_config.yaml
    outs:
      - data/processed/features/train.parquet
      - data/processed/features/val.parquet
      - data/processed/features/test.parquet

  # Stage 3: Task A — Anomaly Detection Baselines
  train_anomaly:
    cmd: uv run python -m src.models.train_anomaly
    deps:
      - src/models/train_anomaly.py
      - data/interim/splits/anomaly_semisup/
      - data/interim/splits/anomaly_supervised/
      - configs/data_config.yaml
    metrics:
      - experiments/metrics/anomaly_results.json:
          cache: false

  # Stage 4: Task B — Classification Baselines
  train_classification:
    cmd: uv run python -m src.models.train_classification
    deps:
      - src/models/train_classification.py
      - data/interim/splits/classification/
      - configs/data_config.yaml
    metrics:
      - experiments/metrics/classification_results.json:
          cache: false
