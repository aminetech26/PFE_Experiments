vars:
  - configs/data_config.yaml

stages:
  # Stage 0: Costa ingestion -> Parquet
  ingest:
    cmd: uv run python -m src.data.ingestion --dataset ${active_dataset}
    deps:
      - src/data/ingestion.py
      - configs/data_config.yaml
    outs:
      - data/interim/ingestion/${active_dataset}/

  # Stage 1: active dataset task-specific splits
  split:
    cmd: uv run python -m src.data.split_pipeline --dataset ${active_dataset}
    deps:
      - src/data/splitting.py
      - src/data/split_pipeline.py
      - data/interim/ingestion/${active_dataset}/
      - configs/data_config.yaml
    outs:
      - data/interim/splits/${active_dataset}/

  # Stage 1.5: active dataset preprocessing
  preprocess:
    cmd: uv run python -m src.data.preprocess_pipeline --dataset ${active_dataset}
    deps:
      - src/data/preprocessing.py
      - src/data/preprocess_pipeline.py
      - data/interim/splits/${active_dataset}/
      - configs/data_config.yaml
    outs:
      - data/processed/preprocessed/${active_dataset}/

  # Stage 2: active dataset feature engineering
  featurize:
    cmd: uv run python -m src.data.featurize_pipeline --dataset ${active_dataset} --profile plus_physics --task classification
    deps:
      - src/data/features.py
      - src/data/featurize_pipeline.py
      - data/processed/preprocessed/${active_dataset}/classification/
      - configs/data_config.yaml
    outs:
      - data/processed/features/${active_dataset}/

  # Stage 3: active dataset Task B classification baseline
  train_classification:
    cmd: uv run python -m src.modeling.classification.ml.run
    deps:
      - src/modeling/classification/ml/run.py
      - src/modeling/classification/ml/lightgbm_trainer.py
      - src/modeling/classification/ml/lightgbm_model.py
      - src/modeling/classification/ml/catboost_model.py
      - src/modeling/classification/ml/extra_trees_model.py
      - src/modeling/common/feature_loader.py
      - src/modeling/common/hyperparameter_optimizer.py
      - src/modeling/common/system_resources.py
      - configs/model_config.yaml
      - data/processed/features/${active_dataset}/latest_runs.json
    # Classification runners create timestamped artifact dirs under
    # experiments/classification/<model>/<run_name>/
    # and append aggregate records under experiments/metrics/*.jsonl.
    metrics:
      - experiments/metrics/classification_comparison_records.jsonl:
          cache: false
    outs:
      - experiments/checkpoints/classification/lightgbm_model.pkl

  # Stage 4: T-GNN Anomaly Detection for Costa
  train_tgnn:
    cmd: uv run python -m src.modeling.anomaly_detection.dl.train_tgnn --epochs 50 --batch-size 64
    deps:
      - src/modeling/anomaly_detection/dl/tgnn.py
      - src/modeling/anomaly_detection/dl/train_tgnn.py
      - data/interim/ingestion/costa/
    metrics:
      - experiments/metrics/tgnn_results.json:
          cache: false
    outs:
      - experiments/checkpoints/tgnn/tgnn_best.pt

  # Stage 4.5: GTBAD Anomaly Detection
  train_gtbad:
    cmd: uv run python -m src.modeling.anomaly_detection.dl.train_gtbad
    deps:
      - src/modeling/anomaly_detection/dl/train_gtbad.py
      - src/modeling/anomaly_detection/dl/gtbad_model.py
      - src/data/preprocess_gtbad.py
      - data/interim/ingestion/costa/costa_merged.parquet

  # Stage 5: LSTM-AE Preprocessing
  preprocess_lstmae:
    cmd: uv run python -m src.data.preprocess_lstmae
    deps:
      - src/data/preprocess_lstmae.py
      - data/interim/ingestion/costa/costa_merged.parquet
    outs:
      - data/processed/preprocessed/costa_lstmae/lstmae_preprocessed.parquet

# Stage 5: LSTM-AE Preprocessing
  preprocess_scvae:
    cmd: uv run python -m src.data.preprocess_scvae
    deps:
      - src/data/preprocess_scvae.py
      - data/interim/ingestion/costa/costa_merged.parquet
    outs:
      - data/processed/preprocessed/costa_scvae/scvae_sequences.npz
      - data/processed/preprocessed/costa_scvae/scvae_metadata.json


  # Stage 6: LSTM-AE Anomaly Detection
  train_lstmae:
    cmd: uv run python -m src.modeling.anomaly_detection.dl.train_lstmae
    deps:
      - src/modeling/anomaly_detection/dl/lstm_ae_model.py
      - src/modeling/anomaly_detection/dl/train_lstmae.py
      - data/processed/preprocessed/costa_lstmae/lstmae_preprocessed.parquet
    metrics:
      - experiments/metrics/lstmae_results.json:
          cache: false
    outs:
      - experiments/checkpoints/lstmae/lstmae_best.keras

  # Stage 7: LSTM-VAE Anomaly Detection
  train_lstmvae:
    cmd: uv run python -m src.modeling.anomaly_detection.dl.train_lstmvae
    deps:
      - src/modeling/anomaly_detection/dl/lstm_vae_model.py
      - src/modeling/anomaly_detection/dl/train_lstmvae.py
      - data/processed/preprocessed/costa_lstmae/lstmae_preprocessed.parquet
    metrics:
      - experiments/metrics/lstmvae_results.json:
          cache: false
    outs:
      - experiments/checkpoints/lstmvae/lstmvae_best.keras

  # Stage 8: SCVAE Anomaly Detection
  train_scvae:
    cmd: uv run python -m src.modeling.anomaly_detection.dl.train_scvae
    deps:
      - src/modeling/anomaly_detection/dl/scvae_model.py
      - src/modeling/anomaly_detection/dl/train_scvae.py
      - src/modeling/anomaly_detection/dl/gvsao.py
      - data/processed/preprocessed/costa_scvae/scvae_sequences.npz
      - data/processed/preprocessed/costa_scvae/scvae_metadata.json
    metrics:
      - experiments/metrics/scvae_results.json:
          cache: false
    outs:
      - experiments/checkpoints/scvae/scvae_best.pth

  # Stage 9: Hybrid (AE-LSTM + Prophet + IsolationForest) Preprocessing
  preprocess_hybrid:
    cmd: uv run python -m src.data.preprocess_hybrid
    deps:
      - src/data/preprocess_hybrid.py
      - data/interim/ingestion/costa/costa_merged.parquet
    outs:
      - data/processed/preprocessed/costa_hybrid/hybrid_sequences.npz
      - data/processed/preprocessed/costa_hybrid/hybrid_metadata.json

  # Stage 10: Hybrid (AE-LSTM + Prophet + IsolationForest) Training
  train_hybrid:
    cmd: uv run python -m src.modeling.anomaly_detection.dl.train_hybrid
    deps:
      - src/modeling/anomaly_detection/dl/hybrid_model.py
      - src/modeling/anomaly_detection/dl/train_hybrid.py
      - src/modeling/anomaly_detection/dl/gvsao.py
      - data/processed/preprocessed/costa_hybrid/hybrid_sequences.npz
      - data/processed/preprocessed/costa_hybrid/hybrid_metadata.json
    metrics:
      - experiments/metrics/hybrid_results.json:
          cache: false
    outs:
      - experiments/checkpoints/hybrid/hybrid_best.pt

  # Stage 11: GTBAD Plus-Physics Preprocessing
  preprocess_gtbad_plus_physics:
    cmd: uv run python -m src.data.preprocess_gtbad_plus_physics
    deps:
      - src/data/preprocess_gtbad_plus_physics.py
      - src/data/features.py
      - data/interim/ingestion/costa/costa_merged.parquet
    outs:
      - data/processed/preprocessed/costa_gtbad_pp/gtbad_pp_data.npz
      - data/processed/preprocessed/costa_gtbad_pp/gtbad_pp_metadata.json

  # Stage 12: GTBAD Plus-Physics Training
  train_gtbad_plus_physics:
    cmd: uv run python -m src.modeling.anomaly_detection.dl.train_gtbad_plus_physics
    deps:
      - src/modeling/anomaly_detection/dl/train_gtbad_plus_physics.py
      - src/modeling/anomaly_detection/dl/gtbad_model.py
      - src/modeling/anomaly_detection/dl/gvsao.py
      - data/processed/preprocessed/costa_gtbad_pp/gtbad_pp_data.npz
      - data/processed/preprocessed/costa_gtbad_pp/gtbad_pp_metadata.json
    metrics:
      - experiments/metrics/gtbad_plus_physics_results.json:
          cache: false
    outs:
      - experiments/checkpoints/gtbad_plus_physics/gtbad_pp_best.pt

  # Stage 13: GTBAD v2 — Extended HPO (7D GVSAO) + per-feature/group thresholds
  train_gtbad_v2:
    cmd: uv run python -m src.modeling.anomaly_detection.dl.train_gtbad_v2
    deps:
      - src/modeling/anomaly_detection/dl/train_gtbad_v2.py
      - src/modeling/anomaly_detection/dl/gtbad_model.py
      - src/modeling/anomaly_detection/dl/gvsao_v2.py
      - src/data/features.py
      - configs/data_config.yaml
      - configs/model_config.yaml
      - data/interim/ingestion/costa/costa_merged.parquet
    metrics:
      - experiments/metrics/gtbad_v2_results_original.json:
          cache: false
      - experiments/metrics/gtbad_v2_results_plus_physics.json:
          cache: false
    outs:
      - experiments/checkpoints/gtbad_v2/gtbad_v2_original.pt
      - experiments/checkpoints/gtbad_v2/gtbad_v2_plus_physics.pt
