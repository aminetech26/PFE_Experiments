stages:
  # Stage 0: Data Ingestion → Parquet
  # Outputs go to data/interim/ingestion/<dataset>/
  ingest:
    cmd: uv run python -m src.data.ingestion --dataset la_reunion
    deps:
      - src/data/ingestion.py
      - data/raw/University of La Réunion Data/dt1_solar_and_meteorological_measurement.csv
      - data/raw/University of La Réunion Data/dt2_electrical_production_inverter_1_with_faults.csv
      - data/raw/University of La Réunion Data/dt3_electrical_production_inverter_2.csv
    outs:
      - data/interim/ingestion/la_reunion/reunion_dt2_merged.parquet
      - data/interim/ingestion/la_reunion/reunion_dt3_merged.parquet

  # Stage 1: Task-Specific Splits
  # Outputs go to data/interim/splits/<dataset>/
  # Split types: anomaly_semisup, anomaly_supervised, classification
  split:
    cmd: uv run python -m src.data.split_pipeline --dataset la_reunion
    deps:
      - src/data/splitting.py
      - src/data/split_pipeline.py
      - data/interim/ingestion/la_reunion/reunion_dt2_merged.parquet
      - configs/data_config.yaml
    outs:
      - data/interim/splits/la_reunion/anomaly_semisup/train.parquet
      - data/interim/splits/la_reunion/anomaly_semisup/val.parquet
      - data/interim/splits/la_reunion/anomaly_semisup/test.parquet
      - data/interim/splits/la_reunion/anomaly_semisup/split_manifest.json
      - data/interim/splits/la_reunion/anomaly_supervised/train.parquet
      - data/interim/splits/la_reunion/anomaly_supervised/val.parquet
      - data/interim/splits/la_reunion/anomaly_supervised/test.parquet
      - data/interim/splits/la_reunion/anomaly_supervised/split_manifest.json
      - data/interim/splits/la_reunion/classification/train.parquet
      - data/interim/splits/la_reunion/classification/val.parquet
      - data/interim/splits/la_reunion/classification/test.parquet
      - data/interim/splits/la_reunion/classification/split_manifest.json

  # Stage 1.5: Preprocessing (post-split)
  # Handles: missing values, outliers, stationarity transforms
  # See PREPROCESSING_DECISIONS.md for rationale
  preprocess:
    cmd: uv run python -m src.data.preprocess_pipeline --dataset la_reunion
    deps:
      - src/data/preprocessing.py
      - src/data/preprocess_pipeline.py
      - data/interim/splits/la_reunion/anomaly_semisup/train.parquet
      - data/interim/splits/la_reunion/anomaly_semisup/val.parquet
      - data/interim/splits/la_reunion/anomaly_semisup/test.parquet
      - data/interim/splits/la_reunion/anomaly_supervised/train.parquet
      - data/interim/splits/la_reunion/anomaly_supervised/val.parquet
      - data/interim/splits/la_reunion/anomaly_supervised/test.parquet
      - data/interim/splits/la_reunion/classification/train.parquet
      - data/interim/splits/la_reunion/classification/val.parquet
      - data/interim/splits/la_reunion/classification/test.parquet
      - configs/data_config.yaml
    outs:
      - data/processed/preprocessed/la_reunion/anomaly_semisup/train.parquet
      - data/processed/preprocessed/la_reunion/anomaly_semisup/val.parquet
      - data/processed/preprocessed/la_reunion/anomaly_semisup/test.parquet
      - data/processed/preprocessed/la_reunion/anomaly_supervised/train.parquet
      - data/processed/preprocessed/la_reunion/anomaly_supervised/val.parquet
      - data/processed/preprocessed/la_reunion/anomaly_supervised/test.parquet
      - data/processed/preprocessed/la_reunion/classification/train.parquet
      - data/processed/preprocessed/la_reunion/classification/val.parquet
      - data/processed/preprocessed/la_reunion/classification/test.parquet
      - data/processed/preprocessed/la_reunion/preprocess_manifest.json

  # Stage 2: Feature Engineering (post-preprocessing)
  featurize:
    cmd: uv run python -m src.data.featurize_pipeline --profile plus_tsfresh_minimal --task classification
    deps:
      - src/data/features.py
      - src/data/featurize_pipeline.py
      - data/processed/preprocessed/la_reunion/classification/train.parquet
      - data/processed/preprocessed/la_reunion/classification/val.parquet
      - data/processed/preprocessed/la_reunion/classification/test.parquet
      - configs/data_config.yaml
    outs:
      - data/processed/features/latest_runs.json

  # Stage 3: Task A — Anomaly Detection Baselines
  train_anomaly:
    cmd: uv run python -m src.models.train_anomaly
    deps:
      - src/models/train_anomaly.py
      - data/interim/splits/la_reunion/anomaly_semisup/
      - data/interim/splits/la_reunion/anomaly_supervised/
      - configs/data_config.yaml
    metrics:
      - experiments/metrics/anomaly_results.json:
          cache: false

  # Stage 4: Task B — Classification Baselines
  train_classification:
    cmd: uv run python -m src.models.train_classification
    deps:
      - src/models/train_classification.py
      - src/training/feature_loader.py
      - src/training/hyperparameter_optimizer.py
      - configs/model_config.yaml
      - data/processed/features/latest_runs.json
    metrics:
      - experiments/metrics/classification_results.json:
          cache: false
    outs:
      - experiments/checkpoints/classification/lightgbm_model.pkl
